name: PFE Job Discovery Engine

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      min_score:
        description: 'Minimum relevance score threshold (0-100)'
        required: false
        default: '50'
      providers:
        description: 'Comma-separated providers (e.g. greenhouse,lever,jobicy)'
        required: false
        default: ''

concurrency:
  group: discovery-engine
  cancel-in-progress: false

jobs:
  run-discovery:
    name: Run Opportunity Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify DATABASE_URL secret configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing! Please configure DATABASE_URL in GitHub Repository Secrets."
            exit 1
          fi

      - name: Run Discovery CLI
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN_EMAIL: "true"
          DRY_RUN_ATS: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
        run: |
          KWARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            KWARGS="--min-score 50"
          else
            if [ -n "${{ github.event.inputs.min_score }}" ]; then
              KWARGS="$KWARGS --min-score ${{ github.event.inputs.min_score }}"
            else
              KWARGS="$KWARGS --min-score 50"
            fi
            if [ -n "${{ github.event.inputs.providers }}" ]; then
              KWARGS="$KWARGS --providers ${{ github.event.inputs.providers }}"
            fi
          fi
          python -m app.cli_discover $KWARGS
